name: Build ClassIsland Guardian
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-2022
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            
            - name: Install dependencies
              run: pip install pyinstaller && pip install -r src\requirements.txt

            - name: Build Python Executable
              run: |
                pyinstaller --distpath temp -w -F -n guardian src\guardian.py
                pyinstaller --distpath temp -F --copy-metadata readchar -n config src\config.py
                pyinstaller --distpath temp -F -n setup src\setup.py
                pyinstaller --distpath temp -F -n recovery src\recovery.py

            - name: Add MSBuild to PATH
              uses: microsoft/setup-msbuild@v2
            
            - name: Build drivers Executable
              run: msbuild drivers\drivers.slnx /p:Configuration=Release /p:Platform=x64

            - name: Build launcher Executable
              run: msbuild launcher\launcher.slnx /p:Configuration=Release /p:Platform="Any CPU"
            
            - name: Cache Windows ADK
              id: cache-adk
              uses: actions/cache@v4
              with: 
                path: C:\Program Files (x86)\Windows Kits
                key: adk-winpe-10.1.26100.2454-v2
            
            - name: Install WinPE add-on (ADK)
              if: steps.cache-adk.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  # 直链下载 WinPE 附加包（choco 的"成功"不可信，装完立刻验证载荷）
                  curl.exe -L --retry 3 -o adkwinpesetup.exe "https://go.microsoft.com/fwlink/?linkid=2289981"
                  if ($LASTEXITCODE -ne 0) { throw "下载 adkwinpesetup.exe 失败" }
                  .\adkwinpesetup.exe /quiet /norestart /ceip off /features +
                  $code = $LASTEXITCODE
                  Write-Host "adkwinpesetup 退出码: $code"
                  $winpe = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment"
                  if (-not (Test-Path "$winpe\amd64\en-us\winpe.wim")) {
                      Write-Host "=== WinPE 目录内容（前 50 项）==="
                      Get-ChildItem $winpe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 50 -ExpandProperty FullName
                      Write-Host "=== winPE_adk.log 尾部 ==="
                      Get-Content (Join-Path $env:TEMP 'winPE_adk.log') -Tail 80 -ErrorAction SilentlyContinue
                      throw "WinPE amd64 载荷缺失（安装器退出码 $code）"
                  }
                  Write-Host "WinPE amd64 载荷就位 ✅"
            
            - name: Build recovery Environment
              run: |
                $ocs = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\amd64\WinPE_OCs\zh-cn"
                & "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\copype.cmd" amd64 C:\WinPE_amd64
                dism /Mount-Wim /WimFile:C:\WinPE_amd64\media\sources\boot.wim /Index:1 /MountDir:C:\WinPE_amd64\mount
                Copy-Item temp\recovery.exe C:\WinPE_amd64\mount\Windows\System32\recovery.exe -Force                                                                                                           
                Copy-Item src\startnet.cmd C:\WinPE_amd64\mount\Windows\System32\startnet.cmd -Force
                dism /Image:C:\WinPE_amd64\mount /Add-Package /PackagePath:"$ocs\lp.cab"                                                                                                                        
                dism /Image:C:\WinPE_amd64\mount /Add-Package /PackagePath:"$ocs\WinPE-Fonts-zh-CN.cab"                                                                                                         
                dism /Image:C:\WinPE_amd64\mount /Add-Package /PackagePath:"$ocs\WinPE-Fonts-JpanNag.cab"                                                                                                       
                dism /Image:C:\WinPE_amd64\mount /Set-AllIntl:zh-CN     
                Copy-Item C:\WinPE_amd64\media\boot\boot.sdi .\temp\boot.sdi -Force                                                                                                                   
                dism /Unmount-Wim /MountDir:C:\WinPE_amd64\mount /Commit
                Copy-Item C:\WinPE_amd64\media\sources\boot.wim .\temp\recovery.wim
                

            - name: Create App Directory
              run: |
                mkdir app
                mkdir app\drivers
                mkdir app\appdata
                mkdir app\recovery
                copy /y temp\guardian.exe app\appdata\
                copy /y temp\config.exe app\appdata\
                copy /y temp\setup.exe app
                copy /y temp\recovery.wim app\recovery\
                copy /y temp\boot.sdi app\recovery\
                copy /y drivers\x64\Release\*.sys app\drivers\
                copy /y launcher\bin\Release\launcher.exe app\appdata\
              shell: cmd

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifact
                  path: app
