name: Build ClassIsland Guardian
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-2022
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            
            - name: Install dependencies
              run: pip install pyinstaller && pip install -r src\requirements.txt

            - name: Build Python Executable
              run: |
                pyinstaller --distpath temp -w -F -n guardian src\guardian.py
                pyinstaller --distpath temp -F -n config src\config.py
                pyinstaller --distpath temp -F -n setup src\setup.py

            - name: Add MSBuild to PATH
              uses: microsoft/setup-msbuild@v2
            
            - name: Build Driver Executable
              run: msbuild drivers\drivers.slnx /p:Configuration=Release /p:Platform=x64

            - name: Build launcher Executable
              run: msbuild launcher\launcher.slnx /p:Configuration=Release /p:Platform="Any CPU"

            - name: Create App Directory
              run: |
                mkdir app
                mkdir app\drivers
                mkdir app\appdata
                copy /y temp\guardian\guardian.exe app\appdata\
                copy /y temp\config\config.exe app\appdata\
                copy /y temp\setup\setup.exe app
                copy /y drivers\x64\Release\*.sys app\drivers\
                copy /y launcher\bin\Release\launcher.exe app\appdata\
              shell: cmd

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifact
                  path: app
