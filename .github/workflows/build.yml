name: Build ClassIsland Guardian
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-2022
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            
            - name: Install dependencies
              run: pip install pyinstaller && pip install -r src\requirements.txt

            - name: Build Python Executable
              run: |
                pyinstaller --distpath app\appdata -w -n guardian src\guardian.py
                pyinstaller --distpath app\appdata -w -n config src\config.py
                pyinstaller --distpath app -n setup src\setup.py

            - name: Add MSBuild to PATH
              uses: microsoft/setup-msbuild@v2
            
            - name: Build Driver Executable
              run: msbuild drivers\drivers.slnx /p:Configuration=Release /p:Platform=x64

            - name: Build launcher Executable
              run: msbuild launcher\launcher.slnx /p:Configuration=Release /p:Platform=x64 /p:OutputPath=app\appdata

            - name: Create ZIP Archive
              run: |
                if not exist app\drivers mkdir app\drivers
                copy /y drivers\x64\Release\*.sys app\drivers\
                powershell Compress-Archive -Path app\* -DestinationPath build.zip
              shell: cmd
            
            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifact
                  path: build.zip
